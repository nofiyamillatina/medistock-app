<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EA580C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="110" fill="none" stroke="#EA580C" stroke-opacity="0.08" stroke-width="40"/>

  <g filter="url(#shadow)">
    <rect x="110" y="50" width="180" height="200" rx="12" fill="#FFFFFF"/>
    
    <path d="M 110 62 A 12 12 0 0 1 122 50 L 278 50 A 12 12 0 0 1 290 62 L 290 100 L 110 100 Z" fill="url(#bottleGrad)"/>
    
    <text x="130" y="80" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="14" letter-spacing="1">SUPLEMEN</text>
    
    <text x="130" y="130" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="18">Vitamin C</text>
    <text x="130" y="148" fill="#EA580C" font-family="Inter, sans-serif" font-weight="700" font-size="14">1000 mg</text>
    
    <rect x="130" y="162" width="125" height="20" rx="4" fill="#FFEDD5"/>
    <text x="136" y="176" fill="#9A3412" font-family="Inter, sans-serif" font-weight="600" font-size="10">Imunitas & Daya Tahan</text>
    
    <!-- Orange Slice & Chewable Tablet Graphic -->
    <g transform="translate(140, 195)">
      <circle cx="25" cy="22" r="18" fill="#F97316"/>
      <circle cx="25" cy="22" r="14" fill="#FDBA74"/>
      <circle cx="25" cy="22" r="10" fill="#F97316"/>
      
      <circle cx="75" cy="22" r="16" fill="#FDE047" stroke="#EAB308" stroke-width="2"/>
      <text x="75" y="26" text-anchor="middle" fill="#854D0E" font-family="Inter" font-weight="800" font-size="12">C</text>
    </g>

    <path d="M 110 242 L 290 242 L 290 238 A 12 12 0 0 1 278 250 L 122 250 A 12 12 0 0 1 110 238 Z" fill="#EA580C"/>
  </g>
</svg>
