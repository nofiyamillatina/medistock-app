<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="110" fill="none" stroke="#0D9488" stroke-opacity="0.08" stroke-width="40"/>

  <g filter="url(#shadow)">
    <rect x="110" y="50" width="180" height="200" rx="12" fill="#FFFFFF"/>
    
    <!-- Top Bar -->
    <path d="M 110 62 A 12 12 0 0 1 122 50 L 278 50 A 12 12 0 0 1 290 62 L 290 100 L 110 100 Z" fill="url(#boxGrad)"/>
    
    <text x="130" y="80" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="14" letter-spacing="1">ANTIBIOTIK</text>
    
    <!-- Medicine Details -->
    <text x="130" y="130" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="18">Amoxicillin</text>
    <text x="130" y="148" fill="#0D9488" font-family="Inter, sans-serif" font-weight="700" font-size="14">500 mg</text>
    
    <rect x="130" y="162" width="115" height="20" rx="4" fill="#CCFBF1"/>
    <text x="136" y="176" fill="#115E59" font-family="Inter, sans-serif" font-weight="600" font-size="10">Kapsul Antibakteri</text>
    
    <!-- Capsule Illustration -->
    <g transform="translate(130, 195)">
      <!-- Capsule 1 -->
      <g transform="translate(15, 5)">
        <rect x="0" y="0" width="14" height="26" rx="7" fill="#0D9488"/>
        <rect x="0" y="13" width="14" height="13" rx="0" fill="#F59E0B"/>
        <path d="M 0 13 A 7 7 0 0 0 14 13 Z" fill="#F59E0B"/>
      </g>
      <!-- Capsule 2 -->
      <g transform="translate(45, 5) rotate(45)">
        <rect x="0" y="0" width="14" height="26" rx="7" fill="#0D9488"/>
        <rect x="0" y="13" width="14" height="13" rx="0" fill="#F59E0B"/>
        <path d="M 0 13 A 7 7 0 0 0 14 13 Z" fill="#F59E0B"/>
      </g>
      <!-- Capsule 3 -->
      <g transform="translate(90, 5)">
        <rect x="0" y="0" width="14" height="26" rx="7" fill="#0D9488"/>
        <rect x="0" y="13" width="14" height="13" rx="0" fill="#F59E0B"/>
        <path d="M 0 13 A 7 7 0 0 0 14 13 Z" fill="#F59E0B"/>
      </g>
    </g>

    <path d="M 110 242 L 290 242 L 290 238 A 12 12 0 0 1 278 250 L 122 250 A 12 12 0 0 1 110 238 Z" fill="#0D9488"/>
  </g>
</svg>
